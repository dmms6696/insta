<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_self">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>AI형 학교도서관 도서 검색·추천</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6a7280;
      --line: #e5e7eb;
      --primary: #354fef;
      --primary-dark: #243bd6;
      --soft: #eef2ff;
      --green: #0f766e;
      --yellow: #8a5a00;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e9edff 0, #f6f7fb 36%, #fbfbfd 100%);
      color: var(--text);
    }

    .wrap {
      width: min(1120px, 94vw);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-main { padding: 28px; }

    .school {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--soft);
      color: var(--primary-dark);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4.2vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .hero-side {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .privacy {
      border-radius: 18px;
      padding: 14px 15px;
      background: #ecfdf5;
      color: #065f46;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 700;
    }

    .search-box {
      padding: 18px;
      margin-bottom: 18px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input, select, button, textarea { font: inherit; }

    .search-input {
      width: 100%;
      padding: 18px 18px;
      border: 2px solid transparent;
      border-radius: 18px;
      background: #f8fafc;
      color: var(--text);
      font-size: 18px;
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(53, 79, 239, 0.12);
    }

    .search-button {
      padding: 0 24px;
      border: 0;
      border-radius: 18px;
      background: var(--primary);
      color: white;
      font-weight: 950;
      cursor: pointer;
      min-width: 112px;
      transition: 0.2s;
    }

    .search-button:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .search-button:disabled,
    .ai-button:disabled {
      opacity: 0.58;
      cursor: wait;
      transform: none;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .filters.one { grid-template-columns: 1fr; }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: #303849;
      border-radius: 999px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.15s;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: var(--soft);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 22px 2px 12px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .ai-badge {
      padding: 8px 11px;
      border-radius: 999px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 13px;
      font-weight: 900;
      border: 1px solid #fed7aa;
    }

    .ai-badge.on {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .book-card {
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .book-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .book-title {
      margin: 0 0 5px;
      font-size: 21px;
      font-weight: 950;
      line-height: 1.28;
      letter-spacing: -0.03em;
      word-break: keep-all;
    }

    .book-meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status {
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 950;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: #475569;
    }

    .status.available {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: var(--green);
    }

    .status.borrowed {
      background: #fffbeb;
      border-color: #fde68a;
      color: var(--yellow);
    }

    .summary {
      color: #344054;
      font-size: 15px;
      line-height: 1.62;
      margin: 0;
      word-break: keep-all;
    }

    .reason {
      border-left: 4px solid var(--primary);
      background: #f8faff;
      border-radius: 14px;
      padding: 12px 13px;
      font-size: 14px;
      line-height: 1.55;
      color: #27324a;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: #f1f5f9;
      color: #475569;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .tag.ai {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 13px;
    }

    .info div {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      padding: 10px 11px;
      border-radius: 14px;
      line-height: 1.45;
    }

    .info strong {
      display: block;
      color: #64748b;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .info .wide { grid-column: 1 / -1; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .small-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #263246;
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 850;
      flex: 1;
    }

    .small-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

    .loading, .empty {
      padding: 34px;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }


    .category-controls {
      margin: 12px 0 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      color: #374151;
      font-size: 14px;
      line-height: 1.55;
    }

    .category-controls strong {
      color: #111827;
    }

    .category-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .category-action-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #263246;
      border-radius: 14px;
      padding: 10px 13px;
      cursor: pointer;
      font-weight: 850;
    }

    .category-action-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .category-action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .ai-box {
      padding: 18px;
      margin-bottom: 18px;
    }

    .ai-box-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .ai-kicker {
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 950;
      margin-bottom: 4px;
    }

    .ai-title {
      font-size: 21px;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .ai-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .ai-input {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      padding: 15px 16px;
      border: 2px solid transparent;
      border-radius: 18px;
      background: #f8fafc;
      color: var(--text);
      font-size: 16px;
      line-height: 1.55;
      outline: none;
      transition: 0.2s;
    }

    .ai-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(53, 79, 239, 0.12);
    }

    .ai-button {
      padding: 0 24px;
      border: 0;
      border-radius: 18px;
      background: #0f766e;
      color: white;
      font-weight: 950;
      cursor: pointer;
      min-width: 118px;
      transition: 0.2s;
    }

    .ai-button:hover {
      background: #0b5f59;
      transform: translateY(-1px);
    }

    .ai-results {
      margin-top: 14px;
    }

    .ai-note {
      margin-bottom: 12px;
      padding: 12px 13px;
      border-radius: 14px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 800;
    }

    .ai-note.warn {
      background: #fff7ed;
      color: #9a3412;
      border-color: #fed7aa;
    }

    .footer-note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    @media (max-width: 820px) {
      .hero, .grid { grid-template-columns: 1fr; }
      .search-row { grid-template-columns: 1fr; }
      .search-button { height: 56px; }
      .ai-row { grid-template-columns: 1fr; }
      .ai-button { min-height: 56px; }
      .filters { grid-template-columns: 1fr; }
      .book-top { flex-direction: column; }
      .info { grid-template-columns: 1fr; }
      .info .wide { grid-column: auto; }
    }
  </style>
<link rel="stylesheet" href="library-layout.css"><script src="library-api.js"></script></head>

<body>
  <div class="wrap">
    <section class="hero">
      <div class="panel hero-main">
        <div class="school" id="schoolName">학교도서관</div>
        <h1>오늘 읽고 싶은 책을<br>말로 찾아보세요</h1>
        <p class="subtitle">
          제목을 몰라도 괜찮습니다. “친구 관계가 고민될 때 읽을 책”, “짧고 쉬운 책”처럼
          자연스럽게 입력하면 우리 학교 도서관 장서 안에서 찾아드립니다.
        </p>
      </div>

      <div class="panel hero-side">
        <div class="stat">
          <div class="stat-label">등록 장서 수</div>
          <div class="stat-value" id="totalBooks">-</div>
        </div>
        <div class="privacy">
          이름·학번·개인 대출 이력·학년별 기록은 입력하지 않습니다. 장서 정보와 전교생 통합 익명 통계만 활용합니다.
        </div>
      </div>
    </section>

    <section class="panel search-box">
      <div class="search-row">
        <input id="queryInput" class="search-input" type="search"
               placeholder="예: 환경 문제를 다룬 책 / 웃긴 책 / 진로 고민할 때 읽는 책">
        <button class="search-button" onclick="runSearch()">검색</button>
      </div>

      <div class="filters one">
        <select id="categoryFilter" onchange="onCategoryChange()">
          <option value="">전체 분야</option>
        </select>
      </div>

      <div class="chips" id="quickChips"></div>
    </section>

    <section class="panel ai-box">
      <div class="ai-box-head">
        <div>
          <div class="ai-kicker">AI 도서 추천</div>
          <div class="ai-title">문장으로 찾는 도서 추천</div>
        </div>
      </div>
      <div class="ai-row">
        <textarea id="aiQueryInput" class="ai-input"
                  placeholder="예: 우울한 날 기분 좋아지는 미술 분야 책. 너무 전문적이거나 어렵지 않고 쉽게 읽히는 책으로 추천해 줘"></textarea>
        <button id="aiRecommendButton" class="ai-button" onclick="runAiRecommendation()">AI 추천</button>
      </div>
      <div id="aiResults" class="ai-results"></div>
    </section>

    <div class="result-head" id="searchResultsStart">
      <div class="result-title" id="resultTitle">추천 도서</div>
    </div>

    <div id="notice"></div>
    <div id="categoryControls"></div>
    <div id="results" class="grid"></div>
    <div id="categoryControlsBottom"></div>

    <div class="footer-note">
※ 이 검색대는 책 탐색을 돕는 용도입니다. 통합 대출횟수는 도서별 익명 집계이며, 실제 대출 가능 여부는 도서관에서 확인하세요.
    </div>
  </div>

  <script>
    const quickButtons = [
      { label: "우리 학교 인기 도서", type: "popular" },

      { label: "부담 없이 읽기", type: "theme", value: "부담 없이 읽기" },
      { label: "마음이 복잡할 때", type: "theme", value: "마음이 복잡할 때" },
      { label: "친구·관계 고민", type: "theme", value: "친구·관계 고민" },
      { label: "가족을 생각할 때", type: "theme", value: "가족을 생각할 때" },
      { label: "나다움·성장", type: "theme", value: "나다움·성장" },
      { label: "진로·직업 상상", type: "theme", value: "진로·직업 상상" },

      { label: "세상 읽기·토론", type: "theme", value: "세상 읽기·토론" },
      { label: "환경·생명 감수성", type: "theme", value: "환경·생명 감수성" },
      { label: "몸과 건강", type: "theme", value: "몸과 건강" },
      { label: "음식·요리", type: "theme", value: "음식·요리" },

      { label: "자연 탐구", type: "theme", value: "자연 탐구" },
      { label: "수리·논리 탐구", type: "theme", value: "수리·논리 탐구" },
      { label: "기술·디지털 탐색", type: "theme", value: "기술·디지털 탐색" },

      { label: "긴장감·미스터리", type: "theme", value: "긴장감·미스터리" },
      { label: "그림·음악·창작 영감", type: "theme", value: "그림·음악·창작 영감" },
      { label: "스포츠·도전", type: "theme", value: "스포츠·도전" },
      { label: "고전·명작 입문", type: "theme", value: "고전·명작 입문" }
    ];

    let currentFullCategoryMode = false;
    let currentCategoryPage = 1;
    let currentPopularPage = 1;
    let currentQuickFilter = null;
    let aiRequestInFlight = false;
    const CATEGORY_PAGE_SIZE = 30;

    document.addEventListener("DOMContentLoaded", () => {
      renderChips();
      bindEnter();
      bindAiEnter();
      loadConfig();
      loadFacets();

      document.getElementById("resultTitle").textContent = "도서 검색을 시작해 보세요";
      document.getElementById("results").className = "";
      document.getElementById("results").innerHTML = `
        <div class="empty">
          검색창에 책 제목, 주제, 기분, 관심사를 입력하거나 위의 추천 버튼을 눌러 보세요.
        </div>
      `;
    });

    function bindEnter() {
      document.getElementById("queryInput").addEventListener("input", clearQuickFilterOnTyping);
      document.getElementById("queryInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") runSearch();
      });
    }

    function bindAiEnter() {
      document.getElementById("aiQueryInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          runAiRecommendation();
        }
      });
    }

    function renderChips() {
      const box = document.getElementById("quickChips");
      box.innerHTML = quickButtons
        .map((button, index) => `<button class="chip" onclick="setQuickButton(${index})">${escapeHtml(button.label)}</button>`)
        .join("");
    }

    function setQuickButton(index) {
      const button = quickButtons[index];
      if (!button) return;

      document.getElementById("queryInput").value = "";
      currentQuickFilter = button;
      currentFullCategoryMode = false;
      currentCategoryPage = 1;
      currentPopularPage = 1;
      runSearch();
    }

    function setQuery(q) {
      document.getElementById("queryInput").value = q;
      currentQuickFilter = null;
      currentFullCategoryMode = false;
      currentCategoryPage = 1;
      runSearch();
    }

    function onCategoryChange() {
      document.getElementById("queryInput").value = "";
      currentQuickFilter = null;
      currentFullCategoryMode = false;
      currentCategoryPage = 1;
      runSearch();
    }

    function startFullCategoryView() {
      const category = document.getElementById("categoryFilter").value;
      if (!category) return;
      document.getElementById("queryInput").value = "";
      currentQuickFilter = null;
      currentFullCategoryMode = true;
      currentCategoryPage = 1;
      runSearch();
    }

    function changeCategoryPage(delta) {
      currentCategoryPage = Math.max(1, currentCategoryPage + delta);
      currentQuickFilter = null;
      currentFullCategoryMode = true;
      runSearch();
    }

    function changePopularPage(delta) {
      currentPopularPage = Math.max(1, currentPopularPage + delta);
      currentQuickFilter = { label: "우리 학교 인기 도서", type: "popular" };
      currentFullCategoryMode = false;
      runSearch();
    }

    function clearQuickFilterOnTyping() {
      currentQuickFilter = null;
      currentFullCategoryMode = false;
      currentCategoryPage = 1;
    }

    function loadConfig() {
      google.script.run
        .withSuccessHandler(config => {
          document.getElementById("schoolName").textContent = config.schoolName || "학교도서관";
          document.getElementById("totalBooks").textContent = Number(config.totalBooks || 0).toLocaleString() + "권";
        })
        .withFailureHandler(showError)
        .getPublicConfig();
    }

    function loadFacets() {
      google.script.run
        .withSuccessHandler(facets => {
          fillSelect("categoryFilter", "전체 분야", facets.categories || []);
        })
        .withFailureHandler(showError)
        .getFacets();
    }

    function fillSelect(id, label, values) {
      const select = document.getElementById(id);
      const current = select.value;
      select.innerHTML = `<option value="">${escapeHtml(label)}</option>` +
        values.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join("");
      select.value = current;
    }

    function runSearch() {
      const query = document.getElementById("queryInput").value.trim();
      const category = document.getElementById("categoryFilter").value;

      const activeQuick = query ? null : currentQuickFilter;

      if (query || !category) {
        currentFullCategoryMode = false;
        currentCategoryPage = 1;
      }

      const isCuration = activeQuick && (activeQuick.type === "theme" || activeQuick.type === "readingLevel");
      const isPopular = activeQuick && activeQuick.type === "popular";
      const limit = isPopular ? CATEGORY_PAGE_SIZE : ((!query && category && !isCuration) ? CATEGORY_PAGE_SIZE : (isCuration ? 30 : 10));

      const params = {
        query: query,
        category: category,
        limit: limit,
        fullCategoryMode: currentFullCategoryMode,
        page: (activeQuick && activeQuick.type === "popular") ? currentPopularPage : currentCategoryPage,
        pageSize: CATEGORY_PAGE_SIZE,
        popular: Boolean(activeQuick && activeQuick.type === "popular"),
        theme: activeQuick && activeQuick.type === "theme" ? activeQuick.value : "",
        readingLevel: activeQuick && activeQuick.type === "readingLevel" ? activeQuick.value : ""
      };

      showLoading();

      google.script.run
        .withSuccessHandler(renderResults)
        .withFailureHandler(showError)
        .searchBooks(params);
    }

    function runAiRecommendation() {
      if (aiRequestInFlight) return;

      const query = document.getElementById("aiQueryInput").value.trim();
      const category = document.getElementById("categoryFilter").value;

      if (!query) {
        document.getElementById("aiResults").innerHTML = `
          <div class="empty">AI 추천을 받을 문장을 입력해 주세요.</div>
        `;
        return;
      }

      setAiBusy(true);
      showAiLoading();

      google.script.run
        .withSuccessHandler(renderAiRecommendations)
        .withFailureHandler(showAiError)
        .aiRecommendBooks({
          query,
          category,
          limit: 5
        });
    }

    function setAiBusy(isBusy) {
      aiRequestInFlight = Boolean(isBusy);
      const button = document.getElementById("aiRecommendButton");
      if (!button) return;
      button.disabled = aiRequestInFlight;
      button.textContent = aiRequestInFlight ? "추천 중" : "AI 추천";
    }

    function showAiLoading() {
      document.getElementById("aiResults").innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          AI가 학교 장서 안에서 고르고 있습니다.
        </div>
      `;
    }

    function scrollToResults(id) {
      const active = document.activeElement;
      if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
      requestAnimationFrame(() => {
        document.getElementById(id)?.scrollIntoView({
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth',
          block: 'start'
        });
      });
    }

    function renderAiRecommendations(data) {
      setAiBusy(false);
      scrollToResults("aiResults");

      const results = data.results || [];
      const note = data.aiNote || data.message || "";

      if (!results.length) {
        document.getElementById("aiResults").innerHTML = `
          <div class="empty">${escapeHtml(data.message || "AI 추천 결과가 없습니다.")}</div>
        `;
        return;
      }

      document.getElementById("aiResults").innerHTML = `
        ${note ? `<div class="ai-note ${data.aiUsed ? "" : "warn"}">${escapeHtml(note)}</div>` : ""}
        <div class="grid">
          ${results.map(renderBookCard).join("")}
        </div>
      `;
    }

    function showAiError(error) {
      setAiBusy(false);
      scrollToResults("aiResults");
      console.error(error);
      document.getElementById("aiResults").innerHTML = `
        <div class="empty">
          AI 추천 중 오류가 발생했습니다.<br>
          ${escapeHtml(error && error.message ? error.message : String(error))}
        </div>
      `;
    }

    function showLoading() {
      document.getElementById("notice").innerHTML = "";
      const controls = document.getElementById("categoryControls");
      if (controls) controls.innerHTML = "";
      const bottomControls = document.getElementById("categoryControlsBottom");
      if (bottomControls) bottomControls.innerHTML = "";
      document.getElementById("results").className = "";
      document.getElementById("results").innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          책을 찾고 있습니다.
        </div>
      `;
    }

    function renderResults(data) {
      scrollToResults("searchResultsStart");
      const results = data.results || [];
      document.getElementById("results").className = results.length ? "grid" : "";

      const selectedCategory = document.getElementById("categoryFilter").value;
      let title = "전교생 통합 인기·추천 도서";

      if (data.mode === "popular") {
        title = `우리 학교 인기 도서 · ${data.pagination?.page || 1}페이지`;
      } else if (data.mode === "curation") {
        title = `${data.curationLabel || data.query} 큐레이션 도서`;
      } else if (data.mode === "categoryFull" && selectedCategory) {
        title = `${selectedCategory} 분야 전체 보기 · ${data.pagination?.page || 1}페이지`;
      } else if (data.mode === "categoryPreview" && selectedCategory) {
        title = `${selectedCategory} 분야 추천 도서`;
      } else if (data.query) {
        title = `“${data.query}” 검색 결과`;
      }

      const countText = results.length ? `(${results.length}권)` : "";
      const totalText = data.pagination && data.pagination.totalAvailable
        ? ` / 전체 ${Number(data.pagination.totalAvailable).toLocaleString()}권`
        : "";

      document.getElementById("resultTitle").textContent = `${title} ${countText}${totalText}`;
      document.getElementById("notice").innerHTML = "";

      renderCategoryControls(data);

      if (!results.length) {
        document.getElementById("results").innerHTML = `<div class="empty">${escapeHtml(data.message || "검색 결과가 없습니다.")}</div>`;
        return;
      }

      document.getElementById("results").innerHTML = results.map(renderBookCard).join("");
    }

    function renderCategoryControls(data) {
      const topBox = document.getElementById("categoryControls");
      const bottomBox = document.getElementById("categoryControlsBottom");
      if (!topBox || !bottomBox) return;

      topBox.innerHTML = "";
      bottomBox.innerHTML = "";

      const selectedCategory = document.getElementById("categoryFilter").value;
      const pagination = data.pagination || {};
      const total = Number(pagination.totalAvailable || 0);

      if (data.mode === "popular") {
        const start = Number(pagination.start || 0);
        const end = Number(pagination.end || 0);

        topBox.innerHTML = `
          <div class="category-controls">
            <strong>우리 학교 인기 도서</strong><br>
            2024년 3월부터 누적된 전교생 통합 대출횟수 기준입니다.
            대출 이력이 1회 이상 있는 책을 30권씩 나누어 보여 줍니다.
          </div>
        `;

        bottomBox.innerHTML = `
          <div class="category-controls">
            전체 ${total.toLocaleString()}권 중 ${start.toLocaleString()}~${end.toLocaleString()}번을 보고 있습니다.
            <div class="category-actions">
              <button class="category-action-btn" onclick="changePopularPage(-1)" ${pagination.hasPrev ? "" : "disabled"}>
                이전 30권
              </button>
              <button class="category-action-btn" onclick="changePopularPage(1)" ${pagination.hasNext ? "" : "disabled"}>
                다음 30권
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (!selectedCategory || data.query) {
        return;
      }

      if (data.mode === "categoryPreview") {
        topBox.innerHTML = `
          <div class="category-controls">
            <strong>${escapeHtml(selectedCategory)} 분야 추천 도서</strong><br>
            먼저 30권만 보여 줍니다. 전체 목록은 조금 느릴 수 있어 30권씩 나누어 볼 수 있습니다.
          </div>
        `;

        bottomBox.innerHTML = `
          <div class="category-controls">
            ${escapeHtml(selectedCategory)} 분야의 책이 더 많이 있습니다.
            <div class="category-actions">
              <button class="category-action-btn primary" onclick="startFullCategoryView()">
                ${escapeHtml(selectedCategory)} 분야 책 전체 보기
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (data.mode === "categoryFull") {
        const start = Number(pagination.start || 0);
        const end = Number(pagination.end || 0);

        topBox.innerHTML = `
          <div class="category-controls">
            <strong>${escapeHtml(selectedCategory)} 분야 전체 보기</strong><br>
            전체 목록은 조금 느릴 수 있어 30권씩 나누어 보여 줍니다.
          </div>
        `;

        bottomBox.innerHTML = `
          <div class="category-controls">
            전체 ${total.toLocaleString()}권 중 ${start.toLocaleString()}~${end.toLocaleString()}번을 보고 있습니다.
            <div class="category-actions">
              <button class="category-action-btn" onclick="changeCategoryPage(-1)" ${pagination.hasPrev ? "" : "disabled"}>
                이전 30권
              </button>
              <button class="category-action-btn" onclick="changeCategoryPage(1)" ${pagination.hasNext ? "" : "disabled"}>
                다음 30권
              </button>
              <button class="category-action-btn" onclick="currentFullCategoryMode=false; currentCategoryPage=1; runSearch();">
                추천 30권으로 돌아가기
              </button>
            </div>
          </div>
        `;
      }
    }

    function renderBookCard(book) {

      const keywords = String(book.keywords || "")
        .split(",")
        .map(t => t.trim())
        .filter(Boolean)
        .slice(0, 7);

      const aiMatchedTags = Array.isArray(book.aiMatchedTags)
        ? book.aiMatchedTags.map(t => String(t || "").trim()).filter(Boolean).slice(0, 4)
        : [];
      const aiTags = aiMatchedTags.map(t => `<span class="tag ai">AI ${escapeHtml(t)}</span>`).join("");
      const tags = aiTags + keywords.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");

      return `
        <article class="book-card">
          <div class="book-top">
            <div>
              <h2 class="book-title">${escapeHtml(book.title || "제목 없음")}</h2>
              <div class="book-meta">
                ${escapeHtml(book.author || "저자 미상")} · ${escapeHtml(book.publisher || "출판사 미상")}
              </div>
            </div>
          </div>

          <p class="summary">${escapeHtml(book.summary || "책 소개가 아직 입력되지 않았습니다.")}</p>

          <div class="reason">${escapeHtml(book.reason || "장서 정보와 검색어를 바탕으로 추천한 책입니다.")}</div>

          <div class="tags">${tags}</div>

          <div class="info">
            <div><strong>보유권수</strong>${Number(book.copyCount || 1)}권</div>
            <div><strong>청구기호</strong>${escapeHtml(book.callNo || "-")}</div>
            <div><strong>추천자</strong>${escapeHtml(book.location || "추천자 정보 없음")}</div>
            <div><strong>통합 대출</strong>${Number(book.loanCount || 0)}회</div>
            <div class="wide"><strong>한 줄 추천사</strong>${escapeHtml(book.recommendBy || "아직 추천사가 없습니다.")}</div>
            <div class="wide"><strong>세부 분류</strong>${escapeHtml(book.categoryDetail || "-")}</div>
          </div>

          <div class="card-actions">
            <button class="small-btn" onclick="similarBooks('${escapeAttr(book.id)}')">비슷한 책</button>
            <button class="small-btn" onclick="copyCallNo('${escapeAttr(book.callNo || "")}')">청구기호 복사</button>
          </div>
        </article>
      `;
    }

    function similarBooks(id) {
      showLoading();
      google.script.run
        .withSuccessHandler(renderResults)
        .withFailureHandler(showError)
        .getSimilarBooks(id);
    }

    function copyCallNo(callNo) {
      if (!callNo) return;
      navigator.clipboard?.writeText(callNo);
      alert(`청구기호를 복사했습니다.\n${callNo}`);
    }

    function showError(error) {
      scrollToResults("searchResultsStart");
      console.error(error);
      document.getElementById("results").className = "";
      document.getElementById("results").innerHTML = `
        <div class="empty">
          오류가 발생했습니다.<br>
          ${escapeHtml(error && error.message ? error.message : String(error))}
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
